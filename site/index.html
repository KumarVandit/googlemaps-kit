  <style>
    :root {
      --paper: #0a0a0a;
      --ink: #f4f1ea;
      --ink-soft: #b8b3a8;
      --ink-mute: #6e695f;
      --surface: #131312;
      --chip: #1c1c1b;
      --rule: #1f1f1d;
      --message: #2c2c2e;
      --message-ink: #f5f5f7;
      --social: #f4f1ea;
      --social-ink: #0a0a0a;
      --link: #0a84ff;
      --focus: #f4f1ea;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Match gandan.dev bubble geometry (40px body, 93×121 caps, -mr-6 overlap) */
      --imsg-h: 40px;
      --imsg-cap-w: 30.744px;
      --imsg-tail-h: 46.942px;
      --imsg-overlap: -1.5rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; scroll-behavior: smooth; }
    body {
      font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      min-height: 100dvh;
    }
    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.5rem 2rem;
    }
    @media (min-width: 768px) {
      .hero { padding: 2rem 2.5rem 2.5rem; }
    }

    .wrap {
      position: relative;
      margin-top: 1.75rem;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 768px) {
      .wrap { margin-top: 2.75rem; }
    }

    .hero,
    .media-rail {
      scrollbar-width: thin;
      scrollbar-color: rgba(244, 241, 234, 0.2) transparent;
    }
    .hero::-webkit-scrollbar,
    .media-rail::-webkit-scrollbar { width: 8px; }
    .hero::-webkit-scrollbar-thumb,
    .media-rail::-webkit-scrollbar-thumb {
      background: rgba(244, 241, 234, 0.18);
      border-radius: 999px;
    }

    .media-rail {
      position: relative;
      z-index: 1;
      padding: 1.25rem 1.5rem 2rem;
      opacity: 0;
      filter: blur(6px);
      transform: translateY(16px);
      animation: media-in 0.85s var(--ease) 0.18s forwards;
    }
    @media (min-width: 768px) {
      .media-rail { padding: 1.25rem 2.5rem 2.5rem; }
    }

    .media-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      padding-bottom: 2rem;
    }

    .preview-media {
      margin: 0;
      width: 100%;
    }

    .video-player {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      outline: 1px solid oklch(1 0 0 / 0.1);
      outline-offset: -1px;
      background: #111;
    }

    .video-el {
      display: block;
      width: 100%;
      height: auto;
      border-radius: inherit;
      cursor: zoom-in;
    }

    .video-hud {
      position: absolute;
      right: 0.75rem;
      bottom: 0.75rem;
      width: 2rem;
      height: 2rem;
      z-index: 2;
    }

    .video-toggle {
      position: absolute;
      top: 50%;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: none;
      border-radius: 9999px;
      color: var(--ink);
      background: rgba(18, 18, 16, 0.48);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.18s var(--ease), background 0.15s ease;
    }
    .video-toggle:hover { background: rgba(18, 18, 16, 0.68); }
    .video-toggle:active { transform: translate(-50%, -50%) scale(0.96); }
    .video-toggle:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .video-toggle svg {
      width: 0.875rem;
      height: 0.875rem;
      fill: currentColor;
      position: absolute;
      opacity: 0;
      filter: blur(4px);
      transform: scale(0.25);
      transition: opacity 0.2s cubic-bezier(0.2, 0, 0, 1),
                  filter 0.2s cubic-bezier(0.2, 0, 0, 1),
                  transform 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    .video-toggle[data-state="playing"] .ico-pause,
    .video-toggle[data-state="paused"] .ico-play {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }
    .video-toggle[data-state="paused"] .ico-play {
      transform: scale(1) translateX(0.5px);
    }

    .video-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: rotate(-90deg);
    }
    .video-ring-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0);
      stroke-width: 0.75;
    }
    .video-ring-prog {
      fill: none;
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 0.75;
    }

    @keyframes media-in {
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    @media (min-width: 1024px) {
      .page {
        flex-direction: row;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
        --intro-top: 2rem;
        --intro-gap: 1.5rem;
      }
      .hero {
        flex: 0 0 auto;
        width: auto;
        max-width: none;
        min-width: 0;
        height: 100dvh;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding-top: var(--intro-top);
        padding-left: clamp(2.5rem, calc((100vw - 760px) / 4 + 1.25rem), 11rem);
        padding-right: 1rem;
      }
      .wrap {
        margin-top: var(--intro-gap);
        width: 32rem;
        max-width: 100%;
      }
      .media-rail {
        flex: 1 1 auto;
        width: auto;
        max-width: none;
        min-width: 0;
        height: 100dvh;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: calc(var(--intro-top) + var(--intro-gap)) 1.5rem 1.5rem 0.5rem;
      }
      .media-stack { padding-bottom: 3rem; }
    }

    .examine {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      border: 0;
      padding: 1.5rem;
      background: var(--paper);
    }
    .examine[hidden] { display: none; }
    @media (min-width: 1024px) {
      .examine { padding: 4rem; }
    }
    @media (hover: hover) and (pointer: fine) {
      .examine { cursor: none; }
    }

    .examine-stage {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }
    .examine-frame {
      --examine-cap: 94vw;
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      outline: 1px solid oklch(1 0 0 / 0.1);
      outline-offset: -1px;
      background: #111;
      transform-origin: center center;
    }
    @media (min-width: 1024px) {
      .examine-frame { --examine-cap: 78vw; }
    }
    .examine-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: inherit;
    }

    .examine-close,
    .examine-nav {
      position: fixed;
      z-index: 105;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      color: var(--ink);
      background: rgba(18, 18, 16, 0.48);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
    }
    .examine-close:hover,
    .examine-nav:hover { background: rgba(18, 18, 16, 0.72); }
    .examine-close:focus-visible,
    .examine-nav:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }
    .examine-close {
      top: 1rem;
      right: 1rem;
      width: 2rem;
      height: 2rem;
      border-radius: 3px;
    }
    @media (min-width: 1024px) {
      .examine-close { top: 1.5rem; right: 1.5rem; }
    }
    .examine-close svg,
    .examine-nav svg {
      width: 1rem;
      height: 1rem;
      display: block;
    }
    .examine-nav {
      top: 50%;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 9999px;
      transform: translateY(-50%);
    }
    .examine-prev { left: 1rem; }
    .examine-next { right: 1rem; }
    @media (min-width: 1024px) {
      .examine-prev { left: 1.5rem; }
      .examine-next { right: 1.5rem; }
    }
    .examine-nav[hidden] { display: none; }

    .examine-hint {
      position: fixed;
      z-index: 110;
      display: none;
      align-items: center;
      padding: 0.25rem 0.625rem;
      border-radius: 3px;
      background: rgba(18, 18, 16, 0.48);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--ink);
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.01em;
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -50%);
    }
    @media (hover: hover) and (pointer: fine) {
      .examine-hint:not([hidden]) { display: flex; }
    }

    .examine-dots {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      z-index: 105;
      display: flex;
      align-items: center;
      transform: translateX(-50%);
    }
    @media (min-width: 1024px) {
      .examine-dots { bottom: 4rem; }
    }
    .examine-dots[hidden] { display: none; }
    .examine-dot {
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .examine-dot::after {
      content: "";
      display: block;
      width: 0.5rem;
      height: 0.5rem;
      margin: 0 auto;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.25);
      transition: background 0.15s ease;
    }
    .examine-dot:hover::after { background: rgba(255, 255, 255, 0.5); }
    .examine-dot[aria-current="true"]::after { background: var(--ink); }
    .examine-dot:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .prose {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      max-width: 26rem;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .prose p { text-wrap: pretty; }
    .prose p,
    .chat {
      opacity: 0;
      transform: translateY(14px);
      animation: rise 0.75s var(--ease) forwards;
    }
    .prose p:nth-child(1) { animation-delay: 0.04s; }
    .prose p:nth-child(2) { animation-delay: 0.12s; }
    .prose p:nth-child(3) { animation-delay: 0.2s; }
    .prose p:nth-child(4) { animation-delay: 0.28s; }
    .chat { animation-delay: 0.42s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .ctas {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.55rem;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 0.75s var(--ease) 0.3s forwards;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      height: 2.75rem;
      padding: 0 1.15rem;
      border-radius: 9999px;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      text-decoration: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      color: inherit;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.18s var(--ease), filter 0.18s ease, background 0.15s ease, border-color 0.15s ease;
      transform: translateZ(0);
    }
    .pill:hover { transform: translateY(-1px); }
    .pill:active { transform: translateY(0) scale(0.985); }
    .pill:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .pill-start {
      background: #f4f1ea;
      color: #0a0a0a;
    }
    .pill-start:hover { filter: brightness(1.05); }

    .pill-ghost {
      background: transparent;
      color: #f4f1ea;
      border: 1.5px solid rgba(244, 241, 234, 0.55);
      padding-inline: 1rem;
    }
    .pill-ghost:hover {
      border-color: rgba(244, 241, 234, 0.9);
      background: rgba(244, 241, 234, 0.04);
    }
    .pill-ghost.copied {
      border-color: rgba(244, 241, 234, 0.35);
      color: var(--ink-soft);
    }

    /* Keep copy button width stable so iPhone flex wrap doesn't jump */
    .copy-label {
      display: inline-grid;
      justify-items: center;
      white-space: nowrap;
    }
    .copy-label > span {
      grid-area: 1 / 1;
    }
    .copy-label .copy-idle {
      visibility: visible;
    }
    .copy-label .copy-done {
      visibility: hidden;
    }
    #copy-agent.copied .copy-label .copy-idle {
      visibility: hidden;
    }
    #copy-agent.copied .copy-label .copy-done {
      visibility: visible;
    }

    .pill-ico {
      display: flex;
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }
    .pill-ico svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .pill-ico.fill svg {
      fill: currentColor;
    }

    .chat {
      margin-top: auto;
      padding-top: 2.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem; /* gandan space-y-5 between groups */
      max-width: 26rem;
    }

    .imessage {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25rem; /* gandan gap-1 within a group */
    }

    /* Whole bubble moves together - never transform body alone */
    .imsg {
      display: flex;
      align-items: flex-start;
      width: fit-content;
      max-width: 100%;
      transform: translateZ(0);
      transition: transform 0.18s var(--ease), filter 0.18s ease;
      will-change: transform;
    }
    .imsg.is-interactive:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }
    .imsg.is-interactive:active {
      transform: translateY(0) scale(0.985);
    }
    .chat .imsg {
      opacity: 0;
      animation: bubble-in 0.55s var(--ease) forwards;
    }
    .chat .imessage:nth-child(1) .imsg:nth-child(1) { animation-delay: 0.48s; }
    .chat .imessage:nth-child(1) .imsg:nth-child(2) { animation-delay: 0.54s; }
    .chat .imessage:nth-child(1) .imsg:nth-child(3) { animation-delay: 0.6s; }
    .chat .imessage:nth-child(2) .imsg:nth-child(1) { animation-delay: 0.68s; }
    .chat .imessage:nth-child(2) .imsg:nth-child(2) { animation-delay: 0.74s; }
    .imsg.settled {
      animation: none;
      opacity: 1;
    }

    @keyframes bubble-in {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .imsg-cap {
      flex-shrink: 0;
      display: block;
      pointer-events: none;
      user-select: none;
      width: var(--imsg-cap-w);
      height: var(--imsg-h);
    }
    .imsg-cap.tail {
      height: var(--imsg-tail-h);
    }
    .imsg-cap-l { margin-right: var(--imsg-overlap); }
    .imsg-cap-r { margin-left: var(--imsg-overlap); }
    .imsg-cap path.fill-message { fill: var(--message); }
    .imsg-cap path.fill-social { fill: var(--social); }

    .imsg-body {
      position: relative;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      height: var(--imsg-h);
      padding: 0 0.5rem;
      border-radius: 1rem;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.015rem;
      line-height: 1;
      white-space: nowrap;
      text-decoration: none;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s ease;
    }
    .imsg-body.label {
      background: var(--message);
      color: var(--message-ink);
      cursor: default;
    }
    .imsg-body.social {
      background: var(--social);
      color: var(--social-ink);
    }
    .imsg-body.message {
      background: var(--message);
      color: var(--message-ink);
    }
    .imsg-body.mail {
      background: var(--message);
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a.imsg-body:focus-visible,
    button.imsg-body:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .imsg-body .icon {
      display: flex;
      width: 0.9rem;
      height: 0.9rem;
      flex-shrink: 0;
    }
    .imsg-body .icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: currentColor;
    }

    @media (prefers-reduced-motion: reduce) {
      .pill:hover,
      .pill:active,
      .imsg.is-interactive:hover,
      .imsg.is-interactive:active { transform: none; filter: none; }
      .media-rail { opacity: 1; filter: none; transform: none; animation: none; }
      .video-toggle:active { transform: translate(-50%, -50%); }
      .examine { cursor: auto; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="wrap">
        <div class="prose">
          <p>googlemaps-kit.</p>
          <p>typescript sdk for maps consumer surfaces - search, places, reviews, directions.</p>
          <p>no platform api key.</p>
          <p>built for developers and agents.</p>
        </div>

  <script type="module">
    import { bind, play, setVolume } from 'https://esm.sh/cuelume@0.2.2';
    import { bindMediaRail } from '/js/media-rail.js';
    import { bindExamine } from '/js/examine.js';
    import { armCues } from '/js/cues.js';

    /** @param {string} name @param {Record<string, string | number | boolean>} [data] */
    function track(name, data) {
      try {
        window.va?.('event', data ? { name, data } : { name });
      } catch {
        /* analytics must never break UX */
      }
    }

    setVolume(0.65);
    bind();
    bindMediaRail();
    bindExamine();

    // Settle entrance animations so hover transforms aren't overridden
    document.querySelectorAll('.imsg').forEach((el) => {
      const done = () => el.classList.add('settled');
      el.addEventListener('animationend', done, { once: true });
      // fallback if animation already finished / reduced motion
      setTimeout(done, 1200);
    });

    // Delegated click tracking for data-track elements (≤2 custom keys for Vercel Pro)
    document.addEventListener('click', (event) => {
      const el = event.target instanceof Element
        ? event.target.closest('[data-track]')
        : null;
      if (!el) return;
      const name = el.getAttribute('data-track');
      const id = el.getAttribute('data-track-id');
      if (!name) return;
      // copy_agent fires a richer outcome event from the handler below
      if (id === 'copy_agent') return;
      track(name, id ? { id } : undefined);
    }, { capture: true });

    const btn = document.getElementById('copy-agent');
    let instruction = '';

    async function loadInstruction() {
      const res = await fetch('/agent-instruction.md', { cache: 'no-cache' });
      if (!res.ok) throw new Error('load failed');
      instruction = await res.text();
    }

    async function copy() {
      try {
        if (!instruction) await loadInstruction();
        await navigator.clipboard.writeText(instruction);
        play('success');
        track('copy_agent', { result: 'ok' });
        btn?.classList.add('copied');
        setTimeout(() => {
          btn?.classList.remove('copied');
        }, 2000);
      } catch {
        play('error');
        track('copy_agent', { result: 'error' });
      }
    }

    btn?.addEventListener('click', () => { void copy(); });
    void loadInstruction().catch(() => {});

    // First interaction cue + engage signal
    const unlock = () => {
      play('ready', { volume: 0.35 });
      armCues();
      track('engage', { type: 'pointer' });
      window.removeEventListener('pointerdown', unlock);
    };
    window.addEventListener('pointerdown', unlock, { once: true });

    // Visibility / dwell breadcrumbs
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        track('session', { state: 'hidden' });
      }
    });
  </script>
